/* Deeside.com house style for sidebar widgets: matches the site (Open Sans, white cards, site green) */
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --ink: #212529; --head: #2d2d2d; --muted: #6c757d; --rule: #e9ecef; --green: #88c425; --green-dk: #4d7a0c;
  --amber-bg: #fff4e0; --amber: #b45309; --red-bg: #fdecec; --red: #b91c1c; --blue: #1d6fb8; }
html, body { background: transparent; }
body { font-family: 'Open Sans', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
.card { display: block; background: #fff; border-top: 4px solid var(--green); }
.card-hd { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px 10px; border-bottom: 1px solid var(--rule); }
.card-hd h3 { font-size: 17px; font-weight: 800; color: var(--head); letter-spacing: -.2px; }
.card-hd .upd { font-size: 11px; color: var(--muted); }
.card-ft { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px 13px; border-top: 1px solid var(--rule); font-size: 13px; font-weight: 700; color: var(--green-dk); }
.card-ft small { font-size: 10.5px; font-weight: 400; color: var(--muted); }
.card:hover .card-ft span:first-child { text-decoration: underline; }
.note { padding: 9px 14px; font-size: 12.5px; border-bottom: 1px solid var(--rule); line-height: 1.4; }
.note.ok { color: var(--green-dk); }
.note.amber { background: var(--amber-bg); color: #7c3a03; font-weight: 600; }
.note.red { background: var(--red-bg); color: #7f1212; font-weight: 600; }
.note small { display: block; font-weight: 400; font-size: 11.5px; margin-top: 1px; }
.load { padding: 36px 14px; text-align: center; color: var(--muted); font-size: 12px; }

/* Inside a WordPress page the page title is already shown, so drop the duplicate H1 */
.embedded .top h1 { display: none; }
.embedded .top p { margin-top: 0; }

.row { display: flex; align-items: center; gap: 11px; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
.row:hover .nm { text-decoration: underline; }
.ic { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
.ic svg { width: 16px; height: 16px; fill: #fff; }
.nm { font-size: 14.5px; font-weight: 700; color: var(--head); flex: 1; }
.ct { font-size: 13px; color: var(--muted); }
.ct b { color: var(--head); font-weight: 700; }
.also { display: flex; align-items: center; gap: 14px; padding: 10px 14px; font-size: 12.5px; color: var(--muted); }
.also a { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; color: var(--green-dk); }
.also a:hover { text-decoration: underline; }
.also svg { width: 13px; height: 13px; fill: currentColor; }
</style>
</head>

<script>
/* Keep the frame on deeside.com exactly the right height, including after fonts load on phones */
(function () {
  var el = document.getElementById('w'), key = 'follow';
  function post() { try { parent.postMessage({deesideWidget: key, height: Math.ceil(el.getBoundingClientRect().height) + 6}, '*'); } catch (e) {} }
  if (window.ResizeObserver) new ResizeObserver(post).observe(el);
  addEventListener('load', post); addEventListener('resize', post);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(post);
  setTimeout(post, 1500); setTimeout(post, 4000);
})();
</script>
