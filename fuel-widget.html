<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deeside fuel prices</title>
<style>
/* Deeside.com house style for sidebar widgets: matches the site (Open Sans, white cards, site green) */
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --ink: #212529; --head: #2d2d2d; --muted: #6c757d; --rule: #e9ecef; --green: #88c425; --green-dk: #4d7a0c;
  --amber-bg: #fff4e0; --amber: #b45309; --red-bg: #fdecec; --red: #b91c1c; --blue: #1d6fb8; }
html, body { background: transparent; }
body { font-family: 'Open Sans', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
.card { display: block; background: #fff; border-top: 4px solid var(--green); }
.card-hd { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px 10px; border-bottom: 1px solid var(--rule); }
.card-hd h3 { font-size: 17px; font-weight: 800; color: var(--head); letter-spacing: -.2px; }
.card-hd .upd { font-size: 11px; color: var(--muted); }
.card-ft { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-top: 1px solid var(--rule); font-size: 13px; font-weight: 700; color: var(--green-dk); }
.card-ft small { font-size: 10.5px; font-weight: 400; color: var(--muted); }
.card:hover .card-ft span:first-child { text-decoration: underline; }
.note { padding: 9px 14px; font-size: 12.5px; border-bottom: 1px solid var(--rule); line-height: 1.4; }
.note.ok { color: var(--green-dk); }
.note.amber { background: var(--amber-bg); color: #7c3a03; font-weight: 600; }
.note.red { background: var(--red-bg); color: #7f1212; font-weight: 600; }
.note small { display: block; font-weight: 400; font-size: 11.5px; margin-top: 1px; }
.load { padding: 36px 14px; text-align: center; color: var(--muted); font-size: 12px; }
</style>
<style>
.prices { display: grid; grid-template-columns: 1fr 1fr; }
.p { padding: 12px 14px 12px; }
.p + .p { border-left: 1px solid var(--rule); }
.lbl { font-size: 12px; font-weight: 700; color: var(--muted); }
.num { font-size: 40px; font-weight: 800; color: var(--head); letter-spacing: -1.5px; line-height: 1.1; }
.num span { font-size: 18px; font-weight: 600; letter-spacing: 0; color: var(--muted); margin-left: 1px; }
.vs { font-size: 11.5px; font-weight: 600; margin-top: 2px; }
.vs.green { color: var(--green-dk); } .vs.amber { color: var(--amber); } .vs.red { color: var(--red); }
.stn { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.3; }
.save { padding: 8px 14px; font-size: 12px; color: var(--ink); background: #f6faee; border-top: 1px solid var(--rule); }
</style>
</head>
<body>
<a class="card" id="w" href="https://deeside-fuel-prices.netlify.app/" target="_blank" rel="noopener">
  <div class="card-hd"><h3>Deeside fuel prices</h3><span class="upd" id="upd"></span></div>
  <div class="load" id="body">Loading…</div>
</a>
<script>
const DATA_URL = 'https://deeside-fuel-prices.netlify.app/stations.json', STALE_HOURS = 120;
const fresh = s => s.updated && (Date.now() - new Date(s.updated)) / 3600000 < STALE_HOURS;
const title = n => (n || '').toLowerCase().replace(/\b\w/g, c => c.toUpperCase()).trim().slice(0, 30);
function vs(price, avg) {
  const d = +(price - avg).toFixed(1);
  return d < 0 ? ['green', `${Math.abs(d)}p below UK average`] : [d < 5 ? 'amber' : 'red', `${d}p above UK average`];
}
fetch(DATA_URL, {cache: 'no-cache'}).then(r => r.json()).then(data => {
  const open = data.stations.filter(s => !(s.name || '').toUpperCase().includes('COSTCO') && s.distance > 0 && s.distance <= 8 && fresh(s));
  const u = open.filter(s => s.unleaded >= 115).sort((a, b) => a.unleaded - b.unleaded)[0];
  const d = open.filter(s => s.diesel >= 115).sort((a, b) => a.diesel - b.diesel)[0];
  if (!u || !d) throw new Error('no prices');
  const [uc, ut] = vs(u.unleaded, data.nationalAvg.unleaded), [dc, dt] = vs(d.diesel, data.nationalAvg.diesel);
  const saving = (data.nationalAvg.unleaded - u.unleaded) / 100 * 50;
  document.getElementById('upd').textContent = 'Updated ' + new Date(data.lastUpdated).toLocaleTimeString('en-GB', {timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit'});
  document.getElementById('body').outerHTML = `
    <div class="prices">
      <div class="p"><div class="lbl">Petrol</div><div class="num">${u.unleaded.toFixed(1)}<span>p</span></div><div class="vs ${uc}">${ut}</div><div class="stn">${title(u.name)}</div></div>
      <div class="p"><div class="lbl">Diesel</div><div class="num">${d.diesel.toFixed(1)}<span>p</span></div><div class="vs ${dc}">${dt}</div><div class="stn">${title(d.name)}</div></div>
    </div>
    ${saving > 0 ? `<div class="save">Filling 50 litres of petrol here saves £${saving.toFixed(2)} on the UK average</div>` : ''}
    <div class="card-ft"><span>Compare all ${data.stations.length} local stations</span></div>`;
  try { parent.postMessage({deesideWidget: 'fuel', height: document.getElementById('w').offsetHeight}, '*'); } catch (e) {}
}).catch(() => { document.getElementById('body').textContent = 'Prices are unavailable right now.'; });
</script>
</body>
</html>
