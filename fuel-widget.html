<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<script>window.__e = fetch('https://fuel.deeside.com/stations.json', {cache: 'no-cache'}).then(function (r) { return r.json(); });
window.__h = fetch('https://fuel.deeside.com/history.json', {cache: 'no-cache'}).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap"></noscript>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deeside fuel prices</title>
<style>
/* Deeside.com house style for sidebar widgets: matches the site (Open Sans, white cards, site green) */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --ink: #212529; --head: #2d2d2d; --muted: #6c757d; --rule: #e9ecef; --green: #88c425; --green-dk: #4d7a0c;
  --amber-bg: #fff4e0; --amber: #b45309; --red-bg: #fdecec; --red: #b91c1c; --blue: #1d6fb8; }
html, body { background: transparent; }
body { font-family: 'Open Sans', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
.card { display: block; background: #fff; border-top: 4px solid var(--green); }
.card-hd { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px 10px; border-bottom: 1px solid var(--rule); }
.card-hd h3 { font-size: 17px; font-weight: 800; color: var(--head); letter-spacing: -.2px; }
.card-hd .upd { font-size: 11px; color: var(--muted); }
.card-ft { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px 13px; border-top: 1px solid var(--rule); font-size: 13px; font-weight: 700; color: var(--green-dk); }
.card-ft small { font-size: 10.5px; font-weight: 400; color: var(--muted); }
.card:hover .card-ft span:first-child { text-decoration: underline; }
.note { padding: 9px 14px; font-size: 12.5px; border-bottom: 1px solid var(--rule); line-height: 1.4; }
.note.ok { color: var(--green-dk); }
.note.amber { background: var(--amber-bg); color: #7c3a03; font-weight: 600; }
.note.red { background: var(--red-bg); color: #7f1212; font-weight: 600; }
.note small { display: block; font-weight: 400; font-size: 11.5px; margin-top: 1px; }
.load { padding: 36px 14px; text-align: center; color: var(--muted); font-size: 12px; }
</style>
<style>
.prices { display: grid; grid-template-columns: 1fr 1fr; }
.p { padding: 12px 14px 12px; }
.p + .p { border-left: 1px solid var(--rule); }
.lbl { font-size: 12px; font-weight: 700; color: var(--muted); }
.num { font-size: 40px; font-weight: 800; color: var(--head); letter-spacing: -1.5px; line-height: 1.1; }
.num span { font-size: 18px; font-weight: 600; letter-spacing: 0; color: var(--muted); margin-left: 1px; }
.vs { font-size: 11.5px; font-weight: 600; margin-top: 2px; }
.vs.green { color: var(--green-dk); } .vs.amber { color: var(--amber); } .vs.red { color: var(--red); }
.stn { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.3; }
.pill { display: inline-block; max-width: 100%; margin: 5px 0 3px; padding: 2px 8px; border-radius: 999px; background: #eef6e0; color: var(--green-dk); font-size: 10.5px; font-weight: 700; line-height: 1.35; }
.spark { margin-top: 8px; }
.spark svg { display: block; width: 100%; height: 24px; overflow: visible; }
.spark small { display: block; font-size: 10.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
.save { padding: 8px 14px; font-size: 12px; color: var(--ink); background: #f6faee; border-top: 1px solid var(--rule); }
</style>
</head>
<body>
<a class="card" id="w" href="https://fuel.deeside.com/" target="_blank" rel="noopener">
  <div class="card-hd"><h3>Deeside fuel prices</h3><span class="upd" id="upd"></span></div>
  <div class="load" id="body">Loading…</div>
</a>
<script>
const DATA_URL = 'https://fuel.deeside.com/stations.json', STALE_HOURS = 120;
const fresh = s => s.updated && (Date.now() - new Date(s.updated)) / 3600000 < STALE_HOURS;
const title = n => (n || '').toLowerCase().replace(/\b\w/g, c => c.toUpperCase()).trim().slice(0, 30);
function vs(price, avg) {
  const d = +(price - avg).toFixed(1);
  return d < 0 ? ['green', `${Math.abs(d)}p below UK average`] : [d < 5 ? 'amber' : 'red', `${d}p above UK average`];
}
function spark(vals) {
  vals = (vals || []).filter(v => typeof v === 'number');
  if (vals.length < 7) return '';
  const W = 140, Hh = 24, lo = Math.min(...vals), hi = Math.max(...vals), r = (hi - lo) || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * W, 2 + (1 - (v - lo) / r) * (Hh - 4)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const [ex, ey] = pts[pts.length - 1], ch = +(vals[vals.length - 1] - vals[0]).toFixed(1);
  const txt = '30-day local trend: ' + (ch === 0 ? 'no change' : (ch < 0 ? `down ${Math.abs(ch)}p` : `up ${ch}p`));
  return `<div class="spark"><svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="#adb5bd" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${ex}" cy="${ey}" r="3" fill="#88c425"/></svg><small>${txt}</small></div>`;
}
Promise.all([(window.__e || fetch(DATA_URL, {cache: 'no-cache'}).then(r => r.json())), window.__h || Promise.resolve(null)]).then(([data, hist]) => {
  const open = data.stations.filter(s => !(s.name || '').toUpperCase().includes('COSTCO') && s.distance > 0 && s.distance <= 8 && fresh(s));
  const u = open.filter(s => s.unleaded >= 115).sort((a, b) => a.unleaded - b.unleaded)[0];
  const d = open.filter(s => s.diesel >= 115).sort((a, b) => a.diesel - b.diesel)[0];
  if (!u || !d) throw new Error('no prices');
  const [uc, ut] = vs(u.unleaded, data.nationalAvg.unleaded), [dc, dt] = vs(d.diesel, data.nationalAvg.diesel);
  const saving = (data.nationalAvg.unleaded - u.unleaded) / 100 * 50;
  const days = (hist && hist.days) || [];
  const su = spark([...days.map(x => x.unleaded), u.unleaded]), sd = spark([...days.map(x => x.diesel), d.diesel]);
  document.getElementById('upd').textContent = 'Updated ' + new Date(data.lastUpdated).toLocaleTimeString('en-GB', {timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit'});
  document.getElementById('body').outerHTML = `
    <div class="prices">
      <div class="p"><div class="lbl">Cheapest petrol</div><div class="pill">${title(u.name)}</div><div class="num">${u.unleaded.toFixed(1)}<span>p</span></div><div class="vs ${uc}">${ut}</div>${su}</div>
      <div class="p"><div class="lbl">Cheapest diesel</div><div class="pill">${title(d.name)}</div><div class="num">${d.diesel.toFixed(1)}<span>p</span></div><div class="vs ${dc}">${dt}</div>${sd}</div>
    </div>
    ${saving > 0 ? `<div class="save">Filling 50 litres of petrol here saves £${saving.toFixed(2)} on the UK average</div>` : ''}
    <div class="card-ft"><span>Compare all ${data.stations.length} local stations</span></div>`;
  try { parent.postMessage({deesideWidget: 'fuel', height: document.getElementById('w').offsetHeight + 6}, '*'); } catch (e) {}
}).catch(() => { document.getElementById('body').textContent = 'Prices are unavailable right now.'; });
</script>

<script>
/* Keep the frame on deeside.com exactly the right height, including after fonts load on phones */
(function () {
  var el = document.getElementById('w'), key = 'fuel';
  function post() { try { parent.postMessage({deesideWidget: key, height: Math.ceil(el.getBoundingClientRect().height) + 6}, '*'); } catch (e) {} }
  if (window.ResizeObserver) new ResizeObserver(post).observe(el);
  addEventListener('load', post); addEventListener('resize', post);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(post);
  setTimeout(post, 1500); setTimeout(post, 4000);
})();
</script>
</body>
</html>
